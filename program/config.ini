[General]
backup_base = ~/SnapshotVault
logging_enabled = true
log_level = INFO
debug = false
hash_enabled = true
external_enabled = true
external_rotation_n = 5
external_search_all = true

[Exclude]
patterns = 
	*.iso
	*.dmg
	*.vmdk
	*.vdi
	.idea
	.idea/*
	.vscode
	.vscode/*
	.venv
	.venv/*
	venv
	venv/*
	*.log
	*.bak
	*.old

[Profile:Documents2]
paths = /home/user/word
exclude = *.psd
	*.ai
rotation_n = 10
interval_min = 30
hash_enabled = true
ignore_hidden = true
external_enabled = true
external_rotation_n = 5
external_search_all = true

